<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>TG Glance — Telegram on G2</title>
    <link rel="icon" href="data:," />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #232323;
        color: #E5E5E5;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #app {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        gap: 10px;
      }
      /* Browser preview / recording mirror of the 576x288 G2 canvas. */
      .glasses {
        width: 576px;
        max-width: 96vw;
        aspect-ratio: 2 / 1;
        border: 3px solid #444;
        border-radius: 18px;
        background: #0a1f0a;
        padding: 6px;
        box-sizing: border-box;
      }
      .screen {
        width: 100%;
        height: 100%;
        background: #061806;
        color: #7dff9a;
        font: 15px/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        white-space: pre-wrap;
        overflow: hidden;
        padding: 8px 10px;
        box-sizing: border-box;
        border-radius: 10px;
      }
      .screen .t { color: #b6ffc7; font-weight: 700; margin-bottom: 4px; }
      .screen .row { padding: 1px 2px; }
      .screen .row.sel { background: #1d4d24; color: #eaffef; }
      .controls { display: flex; gap: 8px; }
      .controls button {
        font: 600 15px/1 system-ui, sans-serif;
        padding: 10px 18px;
        border-radius: 10px;
        border: 1px solid #555;
        background: #333;
        color: #eee;
        cursor: pointer;
      }
      .controls button:hover { background: #444; }
      .hint { color: #999; font-size: 12px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="app">TG Glance is starting…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
